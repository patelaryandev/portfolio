# Every push to main is checked, built and deployed to the Worker behind patelaryan.dev.
# Pull requests get the same checks and build, without the deploy.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; a newer push waits instead of racing an older deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The deploy log on /how-its-built lists the last 10 commits, so fetch that many.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The stamp records via: github-actions and a link to this run.
      # GITHUB_TOKEN only lifts the GitHub API rate limit for the stars and last-push data.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Worker bundles content/build.json, so it travels with the built site.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            out/
            content/build.json
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://patelaryan.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Exactly the files the check job tested and built.
      - uses: actions/download-artifact@v4
        with:
          name: site

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
